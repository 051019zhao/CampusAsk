# Copy to application.properties (gitignored), then set environment variables.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusask?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:campusask}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.task.scheduling.pool.size=3
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
campusask.jwt.user-secret-key=${JWT_SECRET}
campusask.jwt.user-ttl=7200000
campusask.jwt.user-token-name=token
deepseek.api.key=${DEEPSEEK_API_KEY:}
tavily.api.key=${TAVILY_API_KEY:}
aliyun.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
aliyun.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
aliyun.oss.bucket-name=${OSS_BUCKET:}
aliyun.oss.endpoint=${OSS_ENDPOINT:}
aliyun.oss.url-prefix=${OSS_URL_PREFIX:}
app.admin.registration-key=${ADMIN_REGISTRATION_KEY:}
app.admin.reset-key=${ADMIN_RESET_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
rag.embedding.url=${RAG_EMBEDDING_URL:}
rag.embedding.key=${RAG_EMBEDDING_KEY:}
rag.embedding.model=${RAG_EMBEDDING_MODEL:}
rag.chat.url=${RAG_CHAT_URL:https://api.deepseek.com/chat/completions}
rag.chat.model=${RAG_CHAT_MODEL:deepseek-chat}
rag.retention.interval-ms=3600000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
# Crawler is opt-in. Exact hosts and seeds must be configured by the operator.
crawler.enabled=${CRAWLER_ENABLED:false}
crawler.allowed-hosts=${CRAWLER_ALLOWED_HOSTS:}
crawler.seeds=${CRAWLER_SEEDS:}
crawler.cron=${CRAWLER_CRON:0 30 2 * * *}
crawler.zone=Asia/Shanghai
crawler.max-pages=10
crawler.delay-millis=1500
crawler.content-selector=article, main, .wp_articlecontent, .article-content
